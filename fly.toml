app = "lms-buddy-agent"   # must be globally unique; change it if `fly launch`/`fly apps create` says it's taken
primary_region = "iad"

[build]

[env]
  FAISS_INDEX_PATH = "/data/faiss_index"

[mounts]
  source = "lms_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # always on: no cold start
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/_stcore/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
